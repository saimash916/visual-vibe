<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Us | VISUAL VIBE</title>
  <link rel="icon" type="image/png" href="visualvibe.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0b0b0c;
      --card-bg: #141416;
      --text-color: #f1f1f1;
      --text-muted: #a0a0a0;
      --accent-color: #00ff66;
      --accent-glow: rgba(0, 255, 102, 0.2);
      --border-color: #26262a;
      --font-main: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .page-bg-mosaic {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      padding: 15px;
      opacity: 0.16;
      filter: grayscale(30%) contrast(110%);
      z-index: -2;
      pointer-events: none;
    }

    .mosaic-tile {
      background-size: cover;
      background-position: center;
      border-radius: 8px;
      aspect-ratio: 3 / 4;
      width: 100%;
      max-width: 100%;
    }

    .page-bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, rgba(11,11,12,0.4) 0%, rgba(11,11,12,0.95) 90%);
      z-index: -1;
      pointer-events: none;
    }

    header {
      padding: 1.5rem 5%;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 0.1rem;
      font-weight: 800;
      font-size: 2.2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      line-height: 1;
      flex-wrap: nowrap;
      transform: translateY(6px);
    }

    .logo img {
      display: block;
      width: 110px;
      height: 110px;
      object-fit: contain;
      border-radius: 12px;
      filter: drop-shadow(0 0 10px rgba(0, 255, 102, 0.2));
      flex-shrink: 0;
      transform: translateY(6px);
    }

    .logo-text {
      display: inline-block;
      white-space: nowrap;
      font-size: 1.9rem;
      line-height: 1;
      transform: translateY(1px);
    }

    .logo-text span {
      color: var(--accent-color);
    }

    .back-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }

    .back-btn:hover {
      color: var(--accent-color);
    }

    .container {
      max-width: 650px;
      width: 90%;
      margin: 3rem auto;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 2.5rem;
      border-radius: 16px;
    }

    .form-header {
      margin-bottom: 2rem;
      text-align: center;
    }

    .form-header h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    .form-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .form-control {
      width: 100%;
      background: #0b0b0c;
      border: 1px solid var(--border-color);
      padding: 0.8rem 1rem;
      border-radius: 8px;
      color: var(--text-color);
      font-family: var(--font-main);
      font-size: 0.95rem;
      transition: border-color 0.3s;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 160px;
    }

    .send-btn {
      width: 100%;
      background: var(--accent-color);
      color: #000;
      padding: 0.9rem;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 0.5rem;
    }

    .send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .form-status {
      margin-top: 1rem;
      color: var(--accent-color);
      font-size: 0.9rem;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <div class="page-bg-mosaic">
    <div class="mosaic-tile" style="background-image: url('image_1000.jpg');"></div>
    <div class="mosaic-tile" style="background-image: url('image_1001.jpg');"></div>
    <div class="mosaic-tile" style="background-image: url('image_1002.jpg');"></div>
    <div class="mosaic-tile" style="background-image: url('image_1003.jpg');"></div>

    <div class="mosaic-tile" style="background-image: url('image_1000.jpg');"></div>
    <div class="mosaic-tile" style="background-image: url('image_1001.jpg');"></div>
    <div class="mosaic-tile" style="background-image: url('image_1002.jpg');"></div>
    <div class="mosaic-tile" style="background-image: url('image_1003.jpg');"></div>

    <div class="mosaic-tile" style="background-image: url('image_1000.jpg');"></div>
    <div class="mosaic-tile" style="background-image: url('image_1001.jpg');"></div>
    <div class="mosaic-tile" style="background-image: url('image_1002.jpg');"></div>
    <div class="mosaic-tile" style="background-image: url('image_1003.jpg');"></div>

    <div class="mosaic-tile" style="background-image: url('image_1000.jpg');"></div>
    <div class="mosaic-tile" style="background-image: url('image_1001.jpg');"></div>
    <div class="mosaic-tile" style="background-image: url('image_1002.jpg');"></div>
    <div class="mosaic-tile" style="background-image: url('image_1003.jpg');"></div>
  </div>
  <div class="page-bg-overlay"></div>

  <header>
    <!-- Logo and button both set to redirect to hm.html -->
    <a href="hm.html" class="logo">
      <img src="visual vibe.png" alt="Visual Vibe logo">
      <span class="logo-text">VISUAL <span>VIBE</span></span>
    </a>
    <a href="hm.html" class="back-btn">← Back to Home</a>
  </header>

  <div class="container">
    <div class="form-header">
      <h1>CONTACT US</h1>
      <p>Fill in the details below to contact Saheem Ashraf directly.</p>
    </div>

    <form id="contact-form">
      <!-- 1. NAME BOX -->
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" required maxlength="100">
      </div>

      <!-- 2. TOPIC BOX -->
      <div class="form-group">
        <label for="topic">Topic</label>
        <input type="text" id="topic" name="topic" class="form-control" placeholder="e.g., Logo Design, Poster Art, Branding" required maxlength="120">
      </div>

      <!-- 3. BIG BOX (MESSAGE / DETAILS) -->
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" class="form-control" placeholder="Write your complete message or project details here..." required maxlength="5000"></textarea>
      </div>

      <!-- USER EMAIL ADDRESS -->
      <div class="form-group">
        <label for="email">Your Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required maxlength="254">
      </div>

      <!-- 4. SEND EMAIL BUTTON -->
      <button type="submit" class="send-btn">Send Message</button>
      <p id="form-status" class="form-status" role="status" aria-live="polite"></p>

    </form>
  </div>

  <footer>
    <p>&copy; 2026 Visual Vibe Studio by Saheem Ashraf. All rights reserved.</p>
  </footer>

  <script src="portfolio-store.js"></script>
  <script>
    document.querySelector('#contact-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const data = new FormData(form);
      const isAdminEntry = data.get('email').trim().toLowerCase() === 'saheemashraf916@gmail.com'
        && ['name', 'topic', 'message'].every((field) => data.get(field).trim().toUpperCase() === 'ADMIN');

      if (isAdminEntry) {
        window.location.href = 'admin dashboard.html';
        return;
      }

      const storageKey = 'visual-vibe-messages-v1';
      let messages = [];
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
        if (Array.isArray(saved)) messages = saved;
        messages.unshift({
          id: `message-${Date.now()}-${Math.random().toString(36).slice(2)}`,
          name: data.get('name').trim(),
          topic: data.get('topic').trim(),
          message: data.get('message').trim(),
          email: data.get('email').trim(),
          received: new Date().toISOString(),
        });
        localStorage.setItem(storageKey, JSON.stringify(messages));
        window.VisualVibeAnalytics?.trackInquiry();
        form.reset();
        document.querySelector('#form-status').textContent = 'Your message was sent to the studio.';
      } catch (error) {
        document.querySelector('#form-status').textContent = 'We could not save your message. Please try again.';
      }
    });
  </script>

</body>
